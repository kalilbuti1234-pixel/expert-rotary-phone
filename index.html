<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>سكنار 1.0 — تجربة</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>سكنار 1.0</h1>
      <p class="lead">هذه نسخة تجربة على الويب لتطبيق <strong>سكنار 1.0</strong>. يمكنك الضغط على أرقام لوحة الطلب لرؤية السجل ثم تجربة "الاتصال".</p>

      <section class="phone">
        <div id="display" class="display">--</div>
        <div class="dial">
          <div class="keys">
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key">0</button>
          </div>
          <div class="actions">
            <button id="callBtn" class="action">اتصال</button>
            <button id="clearBtn" class="action alt">مسح</button>
          </div>
        </div>
      </section>

      <p class="hint">نشر سريع: يمكنك تفعيل GitHub Pages من إعدادات المستودع لعرض هذه الصفحة على الويب.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
